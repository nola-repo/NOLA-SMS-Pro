# Google Cloud Build: build, push and deploy the SMS API image to Cloud Run services
# Run from project root: gcloud builds submit --config=cloudbuild.yaml .

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sms-api:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sms-api:latest'

  # Deploy to Cloud Run service: nola-sms-pro-admin (admin.nolasmspro.com)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nola-sms-pro-admin'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sms-api:latest'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '20'
      - '--concurrency'
      - '30'
      - '--memory'
      - '2Gi'

  # Deploy to Cloud Run service: nola-sms-pro
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nola-sms-pro'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sms-api:latest'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '20'
      - '--concurrency'
      - '30'
      - '--memory'
      - '2Gi'

  # Deploy to Cloud Run service: sms-api
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sms-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sms-api:latest'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '20'
      - '--concurrency'
      - '30'
      - '--memory'
      - '2Gi'

images:
  - 'gcr.io/$PROJECT_ID/sms-api:latest'

options:
    logging: CLOUD_LOGGING_ONLY
