# Google Cloud Build: build, push and deploy the STAGING SMS API image to Cloud Run
# Triggered on pushes to the 'staging' branch

steps:
  # Build the container image for staging
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sms-api-staging:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sms-api-staging:latest'

  # Deploy to Cloud Run Staging Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sms-api-staging'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sms-api-staging:latest'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--concurrency'
      - '30'
      - '--memory'  
      - '1Gi'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/sms-api-staging:latest'

options:
  logging: CLOUD_LOGGING_ONLY
