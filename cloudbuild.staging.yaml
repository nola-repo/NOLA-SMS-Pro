# Google Cloud Build: Backend-only staging deployment (PHP Backend → sms-api-staging)
# The React frontend lives in a separate repo (frontend/) with its own Cloud Build trigger.
steps:
  # 1. Build Docker image for PHP backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sms-api-staging:latest'
      - '.'

  # 2. Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sms-api-staging:latest'

  # 3. Deploy to Cloud Run (staging)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sms-api-staging'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sms-api-staging:latest'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--concurrency'
      - '30'
      - '--memory'
      - '1Gi'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/sms-api-staging:latest'

options:
  logging: CLOUD_LOGGING_ONLY