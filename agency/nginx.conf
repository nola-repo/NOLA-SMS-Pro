# Log format: shows status codes, method, URI, response time
log_format nola_access '[AGENCY] $time_iso8601 | $status | $request_method $request_uri | ${request_time}s | $body_bytes_sent bytes | $remote_addr';

server {
    listen 8080;

    # Send access logs to stdout (visible in Docker Desktop & docker compose logs)
    access_log /dev/stdout nola_access;
    error_log  /dev/stderr warn;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "frame-ancestors 'self' https://*.gohighlevel.com https://*.msgsndr.com https://*.leadconnectorhq.com https://*.ghl-crm.com https://*.nolacrm.io https://*.app.gohighlevel.com https://*.run.app;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy /api/* to the PHP backend (server-side, avoids CORS)
    location /api/ {
        client_max_body_size 15M;
        proxy_pass https://smspro-api.nolacrm.io/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host smspro-api.nolacrm.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Webhook-Secret "f7RkQ2pL9zV3tX8cB1nS4yW6";
        proxy_pass_request_headers on;

        add_header Content-Security-Policy "frame-ancestors 'self' https://*.gohighlevel.com https://*.msgsndr.com https://*.leadconnectorhq.com https://*.ghl-crm.com https://*.nolacrm.io https://*.app.gohighlevel.com https://*.run.app;" always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'X-Webhook-Secret,Content-Type,X-Agency-ID,X-GHL-Location-ID,Authorization' always;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
